name: Build blutter CLI engines (matrix)

on:
  workflow_dispatch:
    inputs:
      blutter-commit:
        description: 'blutter commit hash (empty = default 528acbe)'
        required: false
        type: string
        default: ''
      ndk-version:
        description: 'Android NDK version'
        required: false
        type: string
        default: 'r27'

env:
  NDK_VERSION: ${{ inputs.ndk-version || 'r27' }}
  BLUTTER_COMMIT: ${{ inputs.blutter-commit || '528acbe83ba35a3a53fb97b231cb5f968c7068d1' }}

permissions:
  contents: write

jobs:
  build-cli-engine:
    name: CLI engine ${{ matrix.dart-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dart-version:
          - "2.18.0"
          - "2.18.1"
          - "2.18.2"
          - "2.18.3"
          - "2.18.4"
          - "2.18.5"
          - "2.18.6"
          - "2.18.7"
          - "2.19.0"
          - "2.19.1"
          - "2.19.2"
          - "2.19.3"
          - "2.19.4"
          - "2.19.5"
          - "2.19.6"
          - "3.0.0"
          - "3.0.1"
          - "3.0.2"
          - "3.0.3"
          - "3.0.4"
          - "3.0.5"
          - "3.0.6"
          - "3.0.7"
          - "3.1.0"
          - "3.1.1"
          - "3.1.2"
          - "3.1.3"
          - "3.1.4"
          - "3.1.5"
          - "3.2.0"
          - "3.2.1"
          - "3.2.2"
          - "3.2.3"
          - "3.2.4"
          - "3.2.5"
          - "3.2.6"
          - "3.3.0"
          - "3.3.1"
          - "3.3.2"
          - "3.3.3"
          - "3.3.4"
          - "3.4.0"
          - "3.4.1"
          - "3.4.2"
          - "3.4.3"
          - "3.4.4"
          - "3.5.0"
          - "3.5.1"
          - "3.5.2"
          - "3.5.3"
          - "3.5.4"
          - "3.6.0"
          - "3.6.1"
          - "3.6.2"
          - "3.7.0"
          - "3.7.1"
          - "3.7.2"
          - "3.7.3"
          - "3.8.0"
          - "3.8.1"
          - "3.8.2"
          - "3.8.3"
          - "3.9.0"
          - "3.9.1"
          - "3.9.2"
          - "3.9.3"
          - "3.9.4"
          - "3.10.0"
          - "3.10.1"
          - "3.10.2"
          - "3.10.3"
          - "3.10.4"
          - "3.10.5"
          - "3.10.6"
          - "3.10.7"
          - "3.10.8"
          - "3.10.9"
          - "3.11.0"
          - "3.11.1"
          - "3.11.2"
          - "3.11.3"
          - "3.11.4"
          - "3.11.5"
          - "3.11.6"
          - "3.12.0"
          - "3.12.1"
          - "3.12.2"

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip curl git file pkg-config unzip

      - name: Setup Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: /tmp/blutter-cli-cache
          key: blutter-cli-v3-${{ matrix.dart-version }}-${{ env.BLUTTER_COMMIT }}-${{ env.NDK_VERSION }}

      - name: Build vanilla blutter executable
        run: |
          mkdir -p output /tmp/blutter-cli-cache
          bash scripts/build-blutter-cli.sh \
            --dart-version "${{ matrix.dart-version }}" \
            --ndk-path "$ANDROID_NDK_HOME" \
            --output-dir "$(pwd)/output" \
            --build-root "/tmp/blutter-cli-cache" \
            --blutter-commit "$BLUTTER_COMMIT"

      - name: Verify ELF
        run: |
          ls -lh output/
          file output/blutter-cli_*.so | grep -iE "arm64|aarch64" || { echo "ERROR: not arm64"; exit 1; }

      - name: Commit engine zip into repo (jsDelivr distribution)
        run: |
          f=$(ls output/blutter-cli_*.so | head -n1)
          base=$(basename "$f")
          mkdir -p engines
          python3 - "$f" "engines/$base.zip" <<'PY'
          import sys, os, zipfile
          src, dst = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              z.write(src, arcname=os.path.basename(src))
          PY
          ls -lh "engines/$base.zip"
          git config user.name "engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          git add "engines/$base.zip"
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "engine: $base.zip"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main && git push origin main && ok=1 && break
            echo "push conflict, retry $i"; sleep $((RANDOM % 10 + 3))
          done
          [ "$ok" = "1" ] || { echo "ERROR: push failed after retries"; exit 1; }

      - name: Summary
        run: |
          z=$(ls engines | grep '\.so\.zip$' | head -n1)
          echo "Engine zip committed — served via jsDelivr:"
          echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/engines/$z"
