name: Build blutter CLI engines (matrix)

on:
  workflow_dispatch:
    inputs:
      blutter-commit:
        description: 'blutter commit hash (empty = default 528acbe)'
        required: false
        type: string
        default: ''
      ndk-version:
        description: 'Android NDK version'
        required: false
        type: string
        default: 'r27'

env:
  NDK_VERSION: ${{ inputs.ndk-version || 'r27' }}
  BLUTTER_COMMIT: ${{ inputs.blutter-commit || '528acbe83ba35a3a53fb97b231cb5f968c7068d1' }}

jobs:
  build-cli-engine:
    name: CLI engine ${{ matrix.dart-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dart-version:
          - "2.18.6"
          - "3.2.3"
          - "3.3.4"
          - "3.8.0"
          - "3.8.1"
          - "3.8.2"
          - "3.8.3"
          - "3.9.0"
          - "3.9.1"
          - "3.9.2"
          - "3.9.3"
          - "3.9.4"
          - "3.10.0"
          - "3.10.1"
          - "3.10.2"
          - "3.10.3"
          - "3.10.4"
          - "3.10.5"
          - "3.10.6"
          - "3.10.7"
          - "3.10.8"
          - "3.10.9"
          - "3.11.0"
          - "3.11.1"
          - "3.11.2"
          - "3.11.3"
          - "3.11.4"
          - "3.11.5"
          - "3.11.6"
          - "3.12.0"
          - "3.12.1"
          - "3.12.2"

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 python3-pip \
            curl git file pkg-config unzip

      - name: Setup Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: /tmp/blutter-cli-cache
          key: blutter-cli-${{ matrix.dart-version }}-${{ env.BLUTTER_COMMIT }}-${{ env.NDK_VERSION }}-v2

      - name: Build vanilla blutter executable
        run: |
          mkdir -p output /tmp/blutter-cli-cache
          bash scripts/build-blutter-cli.sh \
            --dart-version "${{ matrix.dart-version }}" \
            --ndk-path "$ANDROID_NDK_HOME" \
            --output-dir "$(pwd)/output" \
            --build-root "/tmp/blutter-cli-cache" \
            --blutter-commit "$BLUTTER_COMMIT"

      - name: Verify ELF
        run: |
          ls -lh output/
          file output/blutter-cli_*.so | grep -iE "arm64|aarch64" \
            || { echo "ERROR: not an arm64 ELF"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter-cli_${{ matrix.dart-version }}_android_arm64
          path: output/blutter-cli_*.so
          retention-days: 30
