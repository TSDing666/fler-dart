name: Build blutter CLI engines (matrix - all versions)

on:
  workflow_dispatch:
    inputs:
      blutter-commit:
        description: 'blutter commit hash (empty = default 528acbe)'
        required: false
        type: string
        default: ''
      ndk-version:
        description: 'Android NDK version'
        required: false
        type: string
        default: 'r27'

env:
  NDK_VERSION: ${{ inputs.ndk-version || 'r27' }}
  BLUTTER_COMMIT: ${{ inputs.blutter-commit || '528acbe83ba35a3a53fb97b231cb5f968c7068d1' }}

jobs:
  build-cli-engine:
    name: CLI engine ${{ matrix.dart-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dart-version:
          - "2.18.0"
          - "2.18.1"
          - "2.18.2"
          - "2.18.3"
          - "2.18.4"
          - "2.18.5"
          - "2.18.6"
          - "2.18.7"
          - "2.19.0"
          - "2.19.1"
          - "2.19.2"
          - "2.19.3"
          - "2.19.4"
          - "2.19.5"
          - "2.19.6"
          - "3.0.0"
          - "3.0.1"
          - "3.0.2"
          - "3.0.3"
          - "3.0.4"
          - "3.0.5"
          - "3.0.6"
          - "3.0.7"
          - "3.1.0"
          - "3.1.1"
          - "3.1.2"
          - "3.1.3"
          - "3.1.4"
          - "3.1.5"
          - "3.2.0"
          - "3.2.1"
          - "3.2.2"
          - "3.2.3"
          - "3.2.4"
          - "3.2.5"
          - "3.2.6"
          - "3.3.0"
          - "3.3.1"
          - "3.3.2"
          - "3.3.3"
          - "3.3.4"
          - "3.4.0"
          - "3.4.1"
          - "3.4.2"
          - "3.4.3"
          - "3.4.4"
          - "3.5.0"
          - "3.5.1"
          - "3.5.2"
          - "3.5.3"
          - "3.5.4"
          - "3.6.0"
          - "3.6.1"
          - "3.6.2"
          - "3.7.0"
          - "3.7.1"
          - "3.7.2"
          - "3.7.3"
          - "3.8.0"
          - "3.8.1"
          - "3.8.2"
          - "3.8.3"
          - "3.9.0"
          - "3.9.1"
          - "3.9.2"
          - "3.9.3"
          - "3.9.4"
          - "3.10.0"
          - "3.10.1"
          - "3.10.2"
          - "3.10.3"
          - "3.10.4"
          - "3.10.5"
          - "3.10.6"
          - "3.10.7"
          - "3.10.8"
          - "3.10.9"
          - "3.11.0"
          - "3.11.1"
          - "3.11.2"
          - "3.11.3"
          - "3.11.4"
          - "3.11.5"
          - "3.11.6"
          - "3.12.0"
          - "3.12.1"
          - "3.12.2"

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip curl git file pkg-config unzip

      - name: Setup Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: /tmp/blutter-cli-cache
          key: blutter-cli-v2-${{ matrix.dart-version }}-${{ env.BLUTTER_COMMIT }}-${{ env.NDK_VERSION }}

      - name: Build vanilla blutter executable
        run: |
          mkdir -p output /tmp/blutter-cli-cache
          bash scripts/build-blutter-cli.sh \
            --dart-version "${{ matrix.dart-version }}" \
            --ndk-path "$ANDROID_NDK_HOME" \
            --output-dir "$(pwd)/output" \
            --build-root "/tmp/blutter-cli-cache" \
            --blutter-commit "$BLUTTER_COMMIT"

      - name: Verify ELF
        run: |
          ls -lh output/
          file output/blutter-cli_*.so | grep -iE "arm64|aarch64" || { echo "ERROR: not arm64"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter-cli_${{ matrix.dart-version }}_android_arm64
          path: output/blutter-cli_*.so
          retention-days: 30

